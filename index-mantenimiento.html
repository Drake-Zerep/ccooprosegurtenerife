<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Página en mantenimiento</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:
radial-gradient(circle at top,#1d2333 0%,#111723 45%,#090c14 100%);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

/* Fondo */

body::before{

content:"";
position:absolute;
width:200%;
height:200%;

background:

linear-gradient(90deg,transparent 49%,rgba(255,0,0,.03)50%,transparent 51%),
linear-gradient(transparent 49%,rgba(255,0,0,.03)50%,transparent 51%);

background-size:80px 80px;

animation:grid 35s linear infinite;

opacity:.25;

}

@keyframes grid{

from{

transform:translateY(0);

}

to{

transform:translateY(-80px);

}

}

.container{

width:min(1200px,92%);
display:flex;
justify-content:space-between;
align-items:center;
gap:80px;
position:relative;
z-index:2;

}

.left{

max-width:520px;

}

.small{

color:#ff3b3b;
letter-spacing:4px;
font-size:14px;
margin-bottom:20px;
text-transform:uppercase;

}

h1{

font-size:68px;
font-weight:900;
line-height:0.95;

}

h1 span{

display:block;
color:#ff2d2d;

}

p{

margin-top:35px;
font-size:20px;
line-height:1.8;
color:#d9d9d9;

}

.cards{

margin-top:45px;
display:flex;
gap:20px;

}

.card{

flex:1;
padding:22px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.03);
backdrop-filter:blur(12px);
border-radius:18px;
text-align:center;

transition:.4s;

}

.card:hover{

transform:translateY(-6px);
border-color:#ff2d2d;

}

.icon{

font-size:42px;
margin-bottom:15px;

}

.card h3{

font-size:18px;
margin-bottom:10px;

}

.card span{

color:#b7b7b7;
font-size:14px;

}

.thanks{

margin-top:55px;
padding:22px;

border-radius:16px;

background:linear-gradient(90deg,#1b1f2b,#2b1010);

border:1px solid rgba(255,0,0,.25);

font-size:32px;

font-weight:700;

letter-spacing:5px;

text-align:center;

box-shadow:0 0 35px rgba(255,0,0,.2);

}

.right{

position:relative;
display:flex;
justify-content:center;
align-items:center;

}

/* Barrera */

.barrier{

width:390px;
height:250px;
border-radius:18px;

background:

repeating-linear-gradient(
45deg,
#111 0px,
#111 25px,
#ff2d2d 25px,
#ff2d2d 50px);

box-shadow:

0 0 50px rgba(255,0,0,.35),
0 20px 50px rgba(0,0,0,.4);

position:relative;

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}

}

.barrier::before{

content:"🛠";

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:130px;
height:130px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-size:62px;

background:#111;

border:4px solid #ff2d2d;

box-shadow:0 0 35px #ff2d2d;

}

/* Anillos */

.ring{

position:absolute;

width:550px;
height:550px;

border-radius:50%;

border:1px solid rgba(255,0,0,.08);

animation:spin 18s linear infinite;

}

.ring:nth-child(2){

width:450px;
height:450px;

animation-duration:10s;
animation-direction:reverse;

}

@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}

.glow{

position:absolute;

width:650px;
height:650px;

background:radial-gradient(circle,#ff2d2d20,transparent 70%);

filter:blur(60px);

}

footer{

position:absolute;
bottom:30px;

width:100%;

text-align:center;

color:#7d7d7d;

letter-spacing:3px;

font-size:14px;

}

@media(max-width:980px){

.container{

flex-direction:column;
text-align:center;

}

.cards{

flex-direction:column;

}

h1{

font-size:48px;

}

.barrier{

width:300px;
height:190px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="small">

● ACTUALIZANDO EL SITIO

</div>

<h1>

PÁGINA

<span>EN MANTENIMIENTO</span>

</h1>

<p>

Estamos pendientes de continuar con el proyecto para ofrecer una experiencia más rápida,
más segura y más completa.


</p>

<div class="cards">

<div class="card">

<div class="icon">⚙</div>

<h3>Mejorando</h3>

<span>Contenidos</span>

</div>

<div class="card">

<div class="icon">💻</div>

<h3>Actualizando</h3>

<span>Tecnología</span>

</div>

<div class="card">

<div class="icon">🛡</div>

<h3>Optimizando</h3>

<span>Seguridad</span>

</div>

</div>

<div class="thanks">

❤️ GRACIAS A TODOS

</div>

</div>

<div class="right">

<div class="glow"></div>

<div class="ring"></div>

<div class="ring"></div>

<div class="barrier"></div>

</div>

</div>

<footer>



</footer>

</body>
</html>
